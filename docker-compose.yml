version: '3.8'

services:
  backend:
    build: .
    container_name: nonprofit-crm-backend
    ports:
      - "8000:8000"
    volumes:
      - ./nonprofit_crm.db:/app/nonprofit_crm.db
    environment:
      - DATABASE_URL=sqlite:///./nonprofit_crm.db
      - SECRET_KEY=change-this-secret-key-in-production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: node:18-alpine
    container_name: nonprofit-crm-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  node_modules:
